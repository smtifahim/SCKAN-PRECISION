<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCKAN-PRECISION Explorer</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/filters.css" />
<link rel="stylesheet" href="css/diagram.css" />
<link rel="stylesheet" href="css/table.css" />
</head>
<body>
<div class="app-sticky-top">
  <header class="app-header">
    <h1 class="app-title">SCKAN Connectivity &harr; PRECISION Cell Types</h1>
    <p class="app-subtitle">Bridging SCKAN neural connectivity populations with PRECISION molecular cell types</p>
    <nav class="app-tabs">
      <button class="app-tab is-active" data-panel="panel-view-a" type="button">
        (A) DRG Afferents: Candidate Phenotypes
      </button>
      <button class="app-tab" data-panel="panel-view-b" type="button">
        (B) Generic DRG Model: Candidate Cell Types
      </button>
      <button class="app-tab" data-panel="panel-view-c" type="button">
        (C) Generic DRG Model: Candidate Cell Types By Fiber Type
      </button>
    </nav>
  </header>

  <div id="view-a-chrome" class="view-a-chrome">
    <div class="filter-panel">
      <div class="filter-bar">
        <div id="filter-end-organ" class="filter-field"></div>
        <div id="filter-species" class="filter-field"></div>
        <div id="filter-gene" class="filter-field"></div>
        <div id="filter-axon-type" class="filter-field"></div>
        <div id="filter-circuit-role" class="filter-field"></div>
        <button id="btn-reset" class="btn btn-reset" type="button">Reset filters</button>
      </div>
      <div class="view-toggle-row">
        <div id="view-toggle" class="btn-group" role="group">
          <button type="button" class="btn is-active" data-view="diagram">Diagram</button>
          <button type="button" class="btn" data-view="table">Table</button>
        </div>
      </div>
    </div>
  </div>

  <div id="view-b-chrome" class="view-a-chrome" hidden>
    <div class="filter-panel">
      <div class="filter-bar">
        <div id="filter-end-organ-b" class="filter-field"></div>
        <div id="filter-species-b" class="filter-field"></div>
        <div id="filter-gene-b" class="filter-field"></div>
        <div id="filter-axon-type-b" class="filter-field"></div>
        <div id="filter-functional-phenotype-b" class="filter-field"></div>
        <div id="filter-threshold-phenotype-b" class="filter-field"></div>
        <div id="filter-neurotransmitter-phenotype-b" class="filter-field"></div>
        <div id="filter-neural-circuit-b" class="filter-field"></div>
        <button id="btn-reset-b" class="btn btn-reset" type="button">Reset filters</button>
      </div>
      <div class="view-toggle-row">
        <div id="view-toggle-b" class="btn-group" role="group">
          <button type="button" class="btn is-active" data-view="diagram">Diagram</button>
          <button type="button" class="btn" data-view="table">Table</button>
        </div>
      </div>
    </div>
  </div>

  <div id="view-c-chrome" class="view-a-chrome" hidden>
    <div class="filter-panel">
      <div class="filter-bar">
        <div id="filter-end-organ-c" class="filter-field"></div>
        <div id="filter-species-c" class="filter-field"></div>
        <div id="filter-gene-c" class="filter-field"></div>
        <div id="filter-axon-type-c" class="filter-field"></div>
        <div id="filter-functional-phenotype-c" class="filter-field"></div>
        <div id="filter-threshold-phenotype-c" class="filter-field"></div>
        <div id="filter-neurotransmitter-phenotype-c" class="filter-field"></div>
        <div id="filter-neural-circuit-c" class="filter-field"></div>
        <button id="btn-reset-c" class="btn btn-reset" type="button">Reset filters</button>
      </div>
    </div>
  </div>
</div>

<main class="app-main">
  <section id="panel-view-a" class="app-panel">
    <div class="content-grid">
      <div class="content-main">
      <div class="population-panel-box">
        <div id="population-caption-table" class="population-scroll"></div>
        <div id="population-resize-handle" class="population-resize-handle" title="Drag to resize"></div>
      </div>

      <div class="legend-panel-row">
        <div id="layout-toggle" class="btn-stack layout-toggle-group" role="group">
          <button type="button" class="btn is-active" data-rankdir="LR">Left&rarr;Right</button>
          <button type="button" class="btn" data-rankdir="TB">Top&darr;Bottom</button>
        </div>

        <div id="top-legend" class="legend-diagram-box legend-panel-center"></div>

        <div class="btn-stack">
          <button id="btn-export-png" class="btn" type="button">Export PNG</button>
          <button id="btn-issues" class="btn" type="button" disabled title="Coming soon: will link to known data issues/caveats">Issues</button>
        </div>
      </div>

      <section class="diagram-panel">
        <div class="diagram-row">
          <div class="diagram-stack">
            <div class="diagram-box">
              <div class="diagram-toolbar">
                <div id="pathway-toggle" class="btn-group" role="group" aria-label="Pathway direction">
                  <button type="button" class="btn is-active" data-pathway="projection" title="Projection pathway: edges run outward from the soma">Projection</button>
                  <button type="button" class="btn" data-pathway="signal" title="Signal direction pathway: edges follow the signal from the end organ through the soma to the spinal cord">Signal</button>
                </div>
                <div class="diagram-zoom-slot"></div>
              </div>
              <div id="diagram-container" class="diagram-container"></div>
              <div id="diagram-caption" class="diagram-caption"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="table-panel" hidden>
        <div class="table-panel-header">
          <h2 class="panel-heading">Candidate mappings (all matching populations)</h2>
          <button id="btn-export-excel" class="btn" type="button">Export to Excel</button>
        </div>
        <div id="table-container"></div>
      </section>
      </div>

      <div id="resize-handle" class="resize-handle" title="Drag to resize"></div>

      <aside id="evidence-panel" class="evidence-panel">
        <div id="edge-legend" class="legend-box"></div>
      </aside>
    </div>
  </section>

  <section id="panel-view-b" class="app-panel" hidden>
    <div class="content-grid">
      <div class="content-main">
      <div class="population-panel-box">
        <div id="population-caption-table-b" class="population-scroll"></div>
        <div id="population-resize-handle-b" class="population-resize-handle" title="Drag to resize"></div>
      </div>

      <div class="legend-panel-row">
        <div id="layout-toggle-b" class="btn-stack layout-toggle-group" role="group">
          <button type="button" class="btn is-active" data-rankdir="LR">Left&rarr;Right</button>
          <button type="button" class="btn" data-rankdir="TB">Top&darr;Bottom</button>
        </div>

        <div id="top-legend-b" class="legend-diagram-box legend-panel-center"></div>

        <div class="btn-stack">
          <button id="btn-export-png-b" class="btn" type="button">Export PNG</button>
          <button id="btn-issues-b" class="btn" type="button" disabled title="Coming soon: will link to known data issues/caveats">Issues</button>
        </div>
      </div>

      <section class="diagram-panel">
        <div class="diagram-row">
          <div class="diagram-stack">
            <div class="diagram-box">
              <div class="diagram-toolbar">
                <div id="pathway-toggle-b" class="btn-group" role="group" aria-label="Pathway direction">
                  <button type="button" class="btn is-active" data-pathway="projection" title="Projection pathway: edges run outward from the soma">Projection</button>
                  <button type="button" class="btn" data-pathway="signal" title="Signal direction pathway: edges follow the signal from the end organ through the soma to the spinal cord">Signal</button>
                </div>
                <div class="diagram-zoom-slot"></div>
              </div>
              <div id="diagram-container-b" class="diagram-container"></div>
              <div id="diagram-caption-b" class="diagram-caption"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="table-panel" hidden>
        <div class="table-panel-header">
          <h2 class="panel-heading">Candidate mappings (all matching populations)</h2>
          <button id="btn-export-excel-b" class="btn" type="button">Export to Excel</button>
        </div>
        <div id="table-container-b"></div>
      </section>
      </div>

      <div id="resize-handle-b" class="resize-handle" title="Drag to resize"></div>

      <aside id="evidence-panel-b" class="evidence-panel">
        <div id="edge-legend-b" class="legend-box"></div>
      </aside>
    </div>
  </section>

  <section id="panel-view-c" class="app-panel" hidden>
    <div class="content-grid">
      <div class="content-main">
      <div class="legend-panel-row">
        <div id="layout-toggle-c" class="btn-stack layout-toggle-group" role="group">
          <button type="button" class="btn is-active" data-rankdir="LR">Left&rarr;Right</button>
          <button type="button" class="btn" data-rankdir="TB">Top&darr;Bottom</button>
        </div>

        <div class="btn-stack">
          <button id="btn-export-png-c" class="btn" type="button">Export PNG</button>
        </div>
      </div>

      <section class="diagram-panel">
        <div class="diagram-row">
          <div class="diagram-stack">
            <div class="diagram-box">
              <div class="diagram-toolbar">
                <div class="diagram-zoom-slot"></div>
              </div>
              <div id="diagram-container-c" class="diagram-container"></div>
              <div id="diagram-caption-c" class="diagram-caption"></div>
              <div id="diagram-note-c" class="diagram-note"></div>
            </div>
          </div>
        </div>
      </section>
      </div>

      <div id="resize-handle-c" class="resize-handle" title="Drag to resize"></div>

      <aside id="evidence-panel-c" class="evidence-panel">
        <div id="details-c" class="legend-box"></div>
      </aside>
    </div>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
